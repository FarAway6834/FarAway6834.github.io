<!DOCTYPE html>
<html>
  <head>
    <title> debugging room </title>
    <script src="https://xunr3.github.io/af.js" fetchpriority="high"></script>
  </head>
  <body>
    <h1> debbugging room </h1>
    <div>
      <anime-framework></anime-framework>
      <style>
        #check-markup:checked ~ #check-process {
          animation : makeCheck 0.1s
        }
        
        #check-markup:not(:checked) ~ #check-process {
          animation : makeUncheck 0.1s
        }
        #check-markup:has(~ #check-process:chekced) {
           background-color : #f0f0f0
        }
        
        #check-markup:has(~ #check-process:not(:checked)) {
            background-color : #ffffff
        }
      </style>
      <input type="checkbox" id="check-markup" name="checkbox">
      <anime-input id="check-process"></anime-input>
    </div>
  </body>
</html>
