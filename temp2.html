  <body>
    <h1> debbugging room </h1>
    <div>
      <anime-framework></anime-framework>
      <style>
        #check-markup:checked ~ #check-process {
          animation : makeCheck 0.1s;
        }
        
        #check-markup:not(:checked) ~ #check-process {
          animation : makeUncheck 0.1s;
        }
        
        body:has(:where(#check-process)) {
            background-color: white;
        }

        body:has(#check-process[checked]) {
            background-color: gray;
        }
      </style>
      <input type="checkbox" id="check-markup" name="checkbox">
      <anime-input id="check-process"></anime-input>
    </div>
